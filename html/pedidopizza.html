<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Pizza</title>
</head>
<body>
    <form method="post">
<h2>Faça a sua pizza</h2>
<p>Escolha os ingredientes e monte a sua pizza</p>

<p>Escolha o sabor da pizza:</p>
<input type="radio" name="sabor" value="frango com bacon"> Frango com bacon<br>
<input type="radio" name="sabor" value="calabresa"> Calabresa<br>
<input type="radio" name="sabor" value="milho"> Milho<br>
<input type="radio" name="sabor" queijos" value="quatro queijos"> Quatro queijos <br>


<p>Deseja acrescentar adicionais?</p>
<input type="checkbox" name="opcional[]" value="queijo"> Queijo<br>
<input type="checkbox" name="opcional[]" value="catupiry"> Catupiry<br>
<input type="checkbox" name="opcional[]" value="azeitona"> Azeitona<br>
<input type="checkbox" name="opcional[]" value="cebola"> Cebola<br>

<p>Deseja borda recheada com catupiry?</p>
<input type="radio" name="borda" value="Sim">Sim<br>
<input type="radio" name="borda" value="Não">Não<br>

<p>Observação:</p>
<input type="text"><br>
<input type="submit" ><br>

    </form>
</body>
</html>
